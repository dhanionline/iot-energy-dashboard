name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TangAmpereAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TangAmpereAI-apk
          path: TangAmpereAI.apk

      # Terbitkan APK siap-instal ke halaman Releases (link unduh langsung, tanpa zip).
      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Tang Ampere AI (build terbaru)
          prerelease: true
          make_latest: false
          body: |
            APK siap instal dari commit ${{ github.sha }} (build #${{ github.run_number }}).
            Unduh **TangAmpereAI.apk** di bawah lalu buka di HP Android (minimal Android 8.0).
          files: TangAmpereAI.apk
